name: Provision and deploy Pixel
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pilot first; live provisions infrastructure but keeps sales closed"
        type: choice
        options: [pilot, live]
        default: pilot
permissions:
  contents: read
concurrency:
  group: pixel-deploy-${{ inputs.stage }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pixel-${{ inputs.stage }}
    env:
      PIXEL_DEPLOY_STAGE: ${{ inputs.stage }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIXEL_EMAIL_FROM: ${{ vars.PIXEL_EMAIL_FROM }}
      PIXEL_ADMIN_EMAILS: ${{ vars.PIXEL_ADMIN_EMAILS }}
      PIXEL_PILOT_EMAILS: ${{ vars.PIXEL_PILOT_EMAILS }}
      PIXEL_RESOURCE_PREFIX: pixel-birthday
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Provision database, private storage and queue
        run: node --use-env-proxy scripts/production/provision.mjs --apply --stage="$PIXEL_DEPLOY_STAGE"
      - name: Apply migrations
        run: npx wrangler d1 migrations apply DB --config wrangler.deploy.json --remote
      - name: Deploy Worker, assets and cleanup schedule
        run: npx wrangler deploy --config wrangler.deploy.json
      - name: Verify providers and configure secrets and webhook
        run: node --use-env-proxy scripts/production/services.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
      - name: Verify deployment reports the expected stage and closed sales
        run: node --use-env-proxy scripts/production/verify.mjs
